# Cilium ClusterMesh Configuration for Service Export
# This manifest exports the swus-server-secondary service from secondary cluster (Cluster 2)
# to be accessible from primary cluster (Cluster 1)

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-cluster-1-to-cluster-2
  namespace: swus-app-secondary
spec:
  description: "Allow traffic from cluster-1 to services in cluster-2"
  endpointSelector: {}
  ingress:
  - fromClusters:
    - "1"
---
# Service Export for Cilium ClusterMesh
# This makes swus-server-secondary visible across cluster mesh
apiVersion: multicluster.cilium.io/v2
kind: CiliumExternalWorkload
metadata:
  name: swus-server-exported
  namespace: swus-app-secondary
spec:
  ipv4:
  - 10.132.0.0/16
---
# NetworkPolicy to allow inter-cluster communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-cluster-1
  namespace: swus-app-secondary
spec:
  podSelector:
    matchLabels:
      app: swus-server-secondary
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: swus-app
    ports:
    - protocol: TCP
      port: 8080
