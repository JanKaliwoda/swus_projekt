apiVersion: v1
kind: Namespace
metadata:
  name: swus-app-secondary
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swus-server-secondary
  namespace: swus-app-secondary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swus-server-secondary
  template:
    metadata:
      labels:
        app: swus-server-secondary
    spec:
      containers:
      - name: server
        image: pmatysiaq/swus-server:2
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: swus-server-secondary-clusterip
  namespace: swus-app-secondary
  labels:
    app: swus-server-secondary
spec:
  type: ClusterIP
  selector:
    app: swus-server-secondary
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
